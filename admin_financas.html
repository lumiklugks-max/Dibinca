<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Admin - Finanças | Dai&Di Lingeries</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <a href="index.html" class="logo">Dai&Di <span>Admin</span></a>
        <ul class="nav-links">
            <li><a href="admin_pedidos.html">Pedidos</a></li>
            <li><a href="admin_financas.html" style="font-weight: bold; color: #bc6c25;">Finanças</a></li>
            <li><a href="index.html">Ver Loja</a></li>
        </ul>
    </header>

    <div class="container" style="margin-top: 40px;">
        <h1 style="margin-bottom: 25px; font-size: 24px; color: #222;">Visão Geral Financeira</h1>

        <!-- Cards de Métricas -->
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-bottom: 30px;">
            <div style="background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #eee; box-shadow: 0 2px 5px rgba(0,0,0,0.02);">
                <p style="font-size: 13px; color: #666; margin-bottom: 8px;">Faturamento Total</p>
                <h3 id="faturamento-total" style="font-size: 24px; color: #2a9d8f;">R$ 0,00</h3>
            </div>
            <div style="background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #eee; box-shadow: 0 2px 5px rgba(0,0,0,0.02);">
                <p style="font-size: 13px; color: #666; margin-bottom: 8px;">Total de Pedidos Aprovados</p>
                <h3 id="qtd-pedidos" style="font-size: 24px; color: #bc6c25;">0</h3>
            </div>
        </div>

        <div style="background: #fff; padding: 20px; border-radius: 8px; border: 1px solid #eee;">
            <h3 style="font-size: 16px; color: #333; margin-bottom: 15px;">Histórico de Transações</h3>
            <div id="lista-transacoes">
                <p style="color: #666; text-align: center; padding: 20px;">Carregando dados financeiros...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { db } from "./firebase-config.js";
        import { collection, getDocs, query } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        async function carregarFinancas() {
            const container = document.getElementById('lista-transacoes');
            const fatTotalEl = document.getElementById('faturamento-total');
            const qtdPedidosEl = document.getElementById('qtd-pedidos');

            try {
                const q = query(collection(db, "pedidos"));
                const querySnapshot = await getDocs(q);

                if (querySnapshot.empty) {
                    container.innerHTML = `<p style="color: #666; text-align: center; padding: 20px;">Nenhuma transação registrada até o momento.</p>`;
                    return;
                }

                let faturamento = 0;
                let quantidade = 0;
                let html = `
                    <table style="width: 100%; border-collapse: collapse; text-align: left; font-size: 14px;">
                        <thead>
                            <tr style="border-bottom: 2px solid #eee; color: #444;">
                                <th style="padding: 12px;">Cliente</th>
                                <th style="padding: 12px;">Forma de Pagamento</th>
                                <th style="padding: 12px;">Valor</th>
                                <th style="padding: 12px;">Status</th>
                            </tr>
                        </thead>
                        <tbody>
                `;

                querySnapshot.forEach((doc) => {
                    const p = doc.data();
                    faturamento += p.total;
                    quantidade++;

                    html += `
                        <tr style="border-bottom: 1px solid #eee;">
                            <td style="padding: 12px;"><strong>${p.cliente}</strong></td>
                            <td style="padding: 12px;">${p.formaPagamento}</td>
                            <td style="padding: 12px; font-weight: bold; color: #2a9d8f;">R$ ${p.total.toFixed(2).replace('.', ',')}</td>
                            <td style="padding: 12px;"><span style="background: #e9edc9; color: #386641; padding: 4px 8px; border-radius: 4px; font-size: 12px; font-weight: bold;">${p.status}</span></td>
                        </tr>
                    `;
                });

                html += `</tbody></table>`;
                container.innerHTML = html;
                fatTotalEl.innerText = "R$ " + faturamento.toFixed(2).replace('.', ',');
                qtdPedidosEl.innerText = quantidade;

            } catch (error) {
                console.error("Erro ao carregar finanças:", error);
                container.innerHTML = `<p style="color: #e63946; text-align: center; padding: 20px;">Erro ao carregar o relatório financeiro.</p>`;
            }
        }

        carregarFinancas();
    </script>

</body>
</html>
